<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livre — AMANA</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/amana-base.css">
<script>
/* Thème adulte/enfant : ajouté ici pour garder l'ordre habituel des feuilles de style (base, thème, contenu). */
(function () {
  var q = new URLSearchParams(location.search), d = q.get('doc');
  if (d === 'placement' || d === 'enseignant') { return; } // documents mixtes (adultes et enfants) : thèmes appliqués section par section par js/livre.js
  var enfant = q.get('public') === 'Enfants';
  var l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'css/theme-' + (enfant ? 'enfant' : 'adulte') + '.css';
  document.head.appendChild(l);
}());
</script>
<script src="js/genre.js"></script>
<link rel="stylesheet" href="css/amana-content.css">
<link rel="stylesheet" href="css/livre.css">
</head>
<body class="livre">
<div class="bk-bar noprint">
  <span class="bk-nom" id="bk-nom">Livre</span>
  <span class="bk-statut" id="bk-statut" role="status" aria-live="polite">Chargement…</span>
  <a href="index.html">← Retour aux leçons</a>
  <button type="button" id="bk-imprimer" disabled>Imprimer le livre</button>
  <p class="bk-conseil">Pour un rendu propre : format A4, échelle 100 %, et décocher « En-têtes et pieds de page » dans la boîte d’impression du navigateur.</p>
</div>
<main class="container" id="livre"></main>
<noscript><p class="container">Ce livre est assemblé par JavaScript : activez-le pour l’afficher et l’imprimer.</p></noscript>
<script src="js/livre.js"></script>
</body>
</html>
